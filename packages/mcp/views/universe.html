<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ES-universet</title>
    <style>
      :root {
        --u-bg: #0d0f12;
        --u-ink: #e9e6df;
        --u-dim: #8b8780;
        --u-active: #f0703c;
        --u-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      .u {
        position: relative;
        border-radius: var(--radius, 12px);
        overflow: hidden;
        background: var(--u-bg);
        color: var(--u-ink);
        font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
        user-select: none;
      }
      .stage {
        position: relative;
        height: 560px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      canvas.dragging {
        cursor: grabbing;
      }
      .head {
        position: absolute;
        left: 18px;
        top: 16px;
        width: 320px;
        pointer-events: none;
      }
      .head h1 {
        margin: 0;
        font-family: var(--u-serif);
        font-weight: 400;
        font-size: 26px;
        letter-spacing: -0.01em;
      }
      .head p {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--u-dim);
      }
      .stats {
        display: flex;
        gap: 20px;
        margin-top: 12px;
      }
      .stats div {
        font-size: 11px;
        color: var(--u-dim);
      }
      .stats b {
        display: block;
        font-family: var(--u-serif);
        font-weight: 400;
        font-size: 22px;
        color: var(--u-ink);
        font-variant-numeric: tabular-nums;
      }
      .tools {
        position: absolute;
        left: 18px;
        bottom: 14px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .search {
        width: 230px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--u-ink);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        font-size: 12px;
        outline: none;
      }
      .search:focus {
        border-color: rgba(240, 112, 60, 0.6);
      }
      .search::placeholder {
        color: #6d6a64;
      }
      .all {
        font-size: 11px;
        color: var(--u-dim);
        display: flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      .all input {
        accent-color: var(--u-active);
      }
      .panel {
        position: absolute;
        right: 14px;
        top: 14px;
        width: 240px;
        max-height: calc(100% - 28px);
        overflow: auto;
        background: rgba(13, 15, 18, 0.84);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 14px;
        font-size: 12px;
        line-height: 1.5;
      }
      .panel h2 {
        margin: 0 0 2px;
        font-family: var(--u-serif);
        font-weight: 400;
        font-size: 18px;
      }
      .panel p {
        margin: 6px 0 0;
        color: #cfcbc3;
      }
      .panel .meta {
        color: var(--u-dim);
        margin-bottom: 6px;
      }
      .panel h3 {
        margin: 12px 0 4px;
        font-size: 11px;
        font-weight: 500;
        color: var(--u-dim);
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        padding-top: 10px;
      }
      .panel ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .panel li {
        padding: 2px 0;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .panel li span:last-child {
        color: var(--u-dim);
        white-space: nowrap;
      }
      .panel .ms li span:first-child {
        color: #cfcbc3;
      }
      .panel em {
        color: var(--u-dim);
        font-style: normal;
      }
      .panel a {
        color: var(--u-ink);
        text-decoration: none;
        border-bottom: 1px solid rgba(233, 230, 223, 0.25);
        cursor: pointer;
      }
      .panel a:hover {
        border-color: var(--u-active);
      }
      .panel .open {
        margin-top: 12px;
      }
      .legend {
        display: grid;
        gap: 4px;
        margin-top: 10px;
        color: var(--u-dim);
      }
      .legend i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 7px;
        vertical-align: -1px;
      }
      .legend .note {
        margin-top: 4px;
      }
      .time {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 12px 18px 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .play {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: transparent;
        color: var(--u-ink);
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .play:hover {
        border-color: var(--u-active);
      }
      .track {
        position: relative;
        height: 38px;
      }
      .bars {
        position: absolute;
        inset: 0 0 12px 0;
        display: flex;
        align-items: flex-end;
        gap: 2px;
      }
      .bars span {
        flex: 1;
        background: rgba(233, 230, 223, 0.13);
        border-radius: 1px;
        min-height: 1px;
        transition: background 0.2s;
      }
      .bars span.on {
        background: rgba(240, 112, 60, 0.55);
      }
      .track input {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        margin: 0;
        appearance: none;
        background: transparent;
        height: 14px;
      }
      .track input::-webkit-slider-runnable-track {
        height: 2px;
        background: rgba(255, 255, 255, 0.15);
      }
      .track input::-webkit-slider-thumb {
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--u-active);
        margin-top: -5px;
      }
      .year {
        font-family: var(--u-serif);
        font-size: 30px;
        font-variant-numeric: tabular-nums;
        min-width: 64px;
        text-align: right;
      }
      .tip {
        position: absolute;
        pointer-events: none;
        background: #1b1d21;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 11px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.1s;
        max-width: 320px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tip span {
        color: var(--u-dim);
      }
      .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--u-dim);
        font-size: 12px;
      }
      @media (max-width: 560px) {
        .panel {
          display: none;
        }
        .head {
          width: auto;
          right: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="u">
      <div class="stage" id="stage">
        <canvas id="c"></canvas>
        <div class="loading" id="loading">Henter ES-universet …</div>
        <div class="head">
          <h1>ES-universet</h1>
          <p>
            Alle fra Entreprenørskolen og selskapene de har startet, vært ES-team i og jobbet i.
          </p>
          <div class="stats">
            <div><b id="s-people">0</b>alumni</div>
            <div><b id="s-active">0</b>aktive selskaper</div>
            <div><b id="s-acq">0</b>oppkjøpt</div>
            <div><b id="s-rounds">0</b>kapitalrunder</div>
          </div>
        </div>
        <div class="tools">
          <input
            class="search"
            id="search"
            placeholder="Søk: «ES 2014», et selskap, en person"
            autocomplete="off"
          />
          <label class="all"><input type="checkbox" id="all" /> Alle arbeidsgivere</label>
        </div>
        <div class="panel" id="panel"></div>
        <div class="tip" id="tip"></div>
      </div>
      <div class="time">
        <button class="play" id="play" aria-label="Spill av">
          <svg id="play-icon" width="12" height="12" viewBox="0 0 12 12">
            <path d="M3 1.5v9l7-4.5z" fill="currentColor" />
          </svg>
        </button>
        <div class="track">
          <div class="bars" id="bars"></div>
          <input type="range" id="year" step="0.02" />
        </div>
        <div class="year" id="year-label"></div>
      </div>
    </div>
    <!--SCRIPT-->
  </body>
</html>
